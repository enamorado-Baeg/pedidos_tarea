
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f4f9;
            padding: 30px;
        }

        .contenedor {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #243b55;
            margin-bottom: 25px;
        }

        h2 {
            color: #243b55;
            margin-bottom: 15px;
        }

        .seccion {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 10px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        button {
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            cursor: pointer;
            background: #243b55;
        }

        button:hover {
            opacity: 0.85;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #243b55;
            color: white;
        }

        #mensaje {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .contenedor {
                padding: 15px;
            }

            th, td {
                padding: 8px 4px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>Sistema de Gestión de Pedidos</h1>

    <!-- 1. VER INVENTARIO -->
    <div class="seccion">
        <h2>1. Ver Inventario</h2>

        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio</th>
                </tr>
            </thead>

            <tbody id="inventario">
            </tbody>
        </table>
    </div>

    <!-- 2. CREAR PRODUCTO -->
    <div class="seccion">
        <h2>2. Crear Producto</h2>

        <label for="nombre">Nombre del producto</label>
        <input type="text" id="nombre"
            placeholder="Nombre del producto" required>

        <label for="cantidad">Cantidad inicial</label>
        <input type="number" id="cantidad"
            placeholder="Cantidad" min="0" step="1" required>

        <label for="precio">Precio (L.)</label>
        <input type="number" id="precio"
            placeholder="Precio" min="0.01" step="0.01" required>

        <button id="registrarProducto" type="button">
            Registrar Producto
        </button>
    </div>

    <!-- 3. REALIZAR PEDIDO -->
    <div class="seccion">
        <h2>3. Realizar Pedido</h2>

        <label for="productoPedido">Producto</label>
        <select id="productoPedido">
            <option value="">Seleccione un producto</option>
        </select>

        <label for="cantidadPedido">Cantidad del pedido</label>
        <input type="number" id="cantidadPedido"
            placeholder="Cantidad del pedido" min="1" step="1" required>

        <button id="enviarPedido" type="button">
            Realizar Pedido
        </button>
    </div>

    <p id="mensaje"></p>

</div>

<script>
    const elementos = {
        inventario: document.getElementById("inventario"),
        nombre: document.getElementById("nombre"),
        cantidad: document.getElementById("cantidad"),
        precio: document.getElementById("precio"),
        productoPedido: document.getElementById("productoPedido"),
        cantidadPedido: document.getElementById("cantidadPedido"),
        mensaje: document.getElementById("mensaje"),
        registrarProducto: document.getElementById("registrarProducto"),
        enviarPedido: document.getElementById("enviarPedido")
    };

    let productos = [
        { nombre: "Arroz", cantidad: 20, precio: 25 },
        { nombre: "Frijoles", cantidad: 15, precio: 30 },
        { nombre: "Azúcar", cantidad: 10, precio: 28 }
    ];

    function renderizarInventario() {
        elementos.inventario.replaceChildren();
        productos.forEach((producto) => {
            const fila = document.createElement("tr");
            const valores = [
                producto.nombre,
                producto.cantidad,
                `L. ${producto.precio.toFixed(2)}`
            ];

            valores.forEach((valor) => {
                const celda = document.createElement("td");
                celda.textContent = valor;
                fila.append(celda);
            });

            elementos.inventario.append(fila);
        });

        renderizarOpcionesProducto();
    }

    function crearProducto() {
        const nombre = elementos.nombre.value.trim();
        const cantidadTexto = elementos.cantidad.value;
        const precioTexto = elementos.precio.value;
        const cantidad = Number(cantidadTexto);
        const precio = Number(precioTexto);

        if (nombre === "" ||
            cantidadTexto === "" ||
            precioTexto === "" ||
            !Number.isInteger(cantidad) ||
            cantidad < 0 ||
            !Number.isFinite(precio) ||
            precio <= 0) {

            mostrarMensaje("Ingrese datos válidos.", "red");
            return;
        }

        productos.push({ nombre, cantidad, precio });
        renderizarInventario();

        elementos.nombre.value = "";
        elementos.cantidad.value = "";
        elementos.precio.value = "";

        mostrarMensaje("Producto registrado correctamente.", "green");
    }

    function renderizarOpcionesProducto() {
        elementos.productoPedido.replaceChildren();
        const opcionInicial = document.createElement("option");
        opcionInicial.value = "";
        opcionInicial.textContent = "Seleccione un producto";
        elementos.productoPedido.append(opcionInicial);

        productos.forEach((producto, index) => {
            const opcion = document.createElement("option");
            opcion.value = String(index);
            opcion.textContent = `${producto.nombre} (Stock: ${producto.cantidad})`;
            elementos.productoPedido.append(opcion);
        });
    }

    function realizarPedido() {
        const indiceTexto = elementos.productoPedido.value;
        const cantidadTexto = elementos.cantidadPedido.value;
        const indice = Number(indiceTexto);
        const cantidad = Number(cantidadTexto);

        if (indiceTexto === "" ||
            cantidadTexto === "" ||
            !Number.isInteger(indice) ||
            indice < 0 ||
            indice >= productos.length ||
            !Number.isInteger(cantidad) ||
            cantidad <= 0) {

            mostrarMensaje("Seleccione un producto e ingrese una cantidad válida.", "red");
            return;
        }

        const producto = productos[indice];

        if (cantidad > producto.cantidad) {
            mostrarMensaje("No hay suficiente inventario.", "red");
            return;
        }

        producto.cantidad -= cantidad;
        const total = cantidad * producto.precio;
        renderizarInventario();

        elementos.cantidadPedido.value = "";
        elementos.productoPedido.value = "";

        mostrarMensaje(
            "Pedido realizado. Total: L. " + total.toFixed(2),
            "green"
        );
    }

    function mostrarMensaje(texto, color) {
        elementos.mensaje.textContent = texto;
        elementos.mensaje.style.color = color;
    }

    elementos.registrarProducto.addEventListener("click", crearProducto);
    elementos.enviarPedido.addEventListener("click", realizarPedido);
    renderizarInventario();
</script>

</body>
</html>
