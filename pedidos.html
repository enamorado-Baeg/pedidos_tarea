<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f4f9;
            padding: 30px;
        }

        .contenedor {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #243b55;
            margin-bottom: 25px;
        }

        h2 {
            color: #243b55;
            margin-bottom: 15px;
        }

        .seccion {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 10px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        button {
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 15px;
            cursor: pointer;
            background: #243b55;
        }

        button:hover {
            opacity: 0.85;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #243b55;
            color: white;
        }

        #mensaje {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .acciones-carrito {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .acciones-carrito button {
            width: 50%;
        }

        #cancelarPedido {
            background: #c62828;
        }

        .total-carrito {
            text-align: right;
            margin-top: 12px;
            font-size: 18px;
            font-weight: bold;
            color: #243b55;
        }

        .eliminar, .cancelar-confirmado {
            width: auto;
            padding: 8px 12px;
            background: #c62828;
        }

        .pedido-cancelado {
            color: #777;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .contenedor {
                padding: 15px;
            }

            th, td {
                padding: 8px 4px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>Sistema de Gestión de Pedidos</h1>

    <!-- 1. VER INVENTARIO -->
    <div class="seccion">
        <h2>1. Ver Inventario</h2>

        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio</th>
                </tr>
            </thead>

            <tbody id="inventario">
            </tbody>
        </table>
    </div>

    <!-- 2. CREAR PRODUCTO -->
    <div class="seccion">
        <h2>2. Crear Producto</h2>

        <label for="nombre">Nombre del producto</label>
        <input type="text" id="nombre"
            placeholder="Nombre del producto" required>

        <label for="cantidad">Cantidad inicial</label>
        <input type="number" id="cantidad"
            placeholder="Cantidad" min="0" step="1" required>

        <label for="precio">Precio (L.)</label>
        <input type="number" id="precio"
            placeholder="Precio" min="0.01" step="0.01" required>

        <button id="registrarProducto" type="button">
            Registrar Producto
        </button>
    </div>

    <!-- 3. AGREGAR AL CARRITO -->
    <div class="seccion">
        <h2>3. Agregar al carrito</h2>

        <label for="productoPedido">Producto</label>
        <select id="productoPedido">
            <option value="">Seleccione un producto</option>
        </select>

        <label for="cantidadPedido">Cantidad</label>
        <input type="number" id="cantidadPedido"
            placeholder="Cantidad" min="1" step="1" required>

        <button id="agregarCarrito" type="button">
            Agregar al carrito
        </button>
    </div>

    <!-- 4. CARRITO -->
    <div class="seccion">
        <h2>4. Carrito de compras</h2>

        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Subtotal</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="carrito"></tbody>
        </table>

        <p class="total-carrito" id="totalCarrito">Total: L. 0.00</p>

        <div class="acciones-carrito">
            <button id="confirmarPedido" type="button">
                Confirmar pedido
            </button>
            <button id="cancelarPedido" type="button">
                Cancelar pedido
            </button>
        </div>
    </div>

    <!-- 5. PEDIDOS REALIZADOS -->
    <div class="seccion">
        <h2>5. Pedidos realizados</h2>

        <table>
            <thead>
                <tr>
                    <th>Pedido</th>
                    <th>Productos</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="pedidos"></tbody>
        </table>
    </div>

<p id="mensaje"></p>

</div>

<script>
    const elementos = {
        inventario: document.getElementById("inventario"),
        nombre: document.getElementById("nombre"),
        cantidad: document.getElementById("cantidad"),
        precio: document.getElementById("precio"),
        productoPedido: document.getElementById("productoPedido"),
        cantidadPedido: document.getElementById("cantidadPedido"),
        carrito: document.getElementById("carrito"),
        totalCarrito: document.getElementById("totalCarrito"),
        pedidos: document.getElementById("pedidos"),
        mensaje: document.getElementById("mensaje"),
        registrarProducto: document.getElementById("registrarProducto"),
        agregarCarrito: document.getElementById("agregarCarrito"),
        confirmarPedido: document.getElementById("confirmarPedido"),
        cancelarPedido: document.getElementById("cancelarPedido")
    };

    let productos = [
        { nombre: "Arroz", cantidad: 20, precio: 25 },
        { nombre: "Frijoles", cantidad: 15, precio: 30 },
        { nombre: "Azúcar", cantidad: 10, precio: 28 }
    ];

    let carrito = [];
    let pedidosRealizados = [];

    function renderizarInventario() {
        elementos.inventario.replaceChildren();
        productos.forEach((producto) => {
            const fila = document.createElement("tr");
            const valores = [
                producto.nombre,
                producto.cantidad,
                `L. ${producto.precio.toFixed(2)}`
            ];

            valores.forEach((valor) => {
                const celda = document.createElement("td");
                celda.textContent = valor;
                fila.append(celda);
            });

            elementos.inventario.append(fila);
        });

        renderizarOpcionesProducto();
    }

    function crearProducto() {
        const nombre = elementos.nombre.value.trim();
        const cantidadTexto = elementos.cantidad.value;
        const precioTexto = elementos.precio.value;
        const cantidad = Number(cantidadTexto);
        const precio = Number(precioTexto);

        if (nombre === "" ||
            cantidadTexto === "" ||
            precioTexto === "" ||
            !Number.isInteger(cantidad) ||
            cantidad < 0 ||
            !Number.isFinite(precio) ||
            precio <= 0) {

            mostrarMensaje("Ingrese datos válidos.", "red");
            return;
        }

        productos.push({ nombre, cantidad, precio });
        renderizarInventario();

        elementos.nombre.value = "";
        elementos.cantidad.value = "";
        elementos.precio.value = "";

        mostrarMensaje("Producto registrado correctamente.", "green");
    }

    function renderizarOpcionesProducto() {
        elementos.productoPedido.replaceChildren();
        const opcionInicial = document.createElement("option");
        opcionInicial.value = "";
        opcionInicial.textContent = "Seleccione un producto";
        elementos.productoPedido.append(opcionInicial);

        productos.forEach((producto, index) => {
            const opcion = document.createElement("option");
            opcion.value = String(index);
            opcion.textContent = `${producto.nombre} (Stock: ${producto.cantidad})`;
            elementos.productoPedido.append(opcion);
        });
    }

    function agregarAlCarrito() {
        const indiceTexto = elementos.productoPedido.value;
        const cantidadTexto = elementos.cantidadPedido.value;
        const indice = Number(indiceTexto);
        const cantidad = Number(cantidadTexto);

        if (indiceTexto === "" ||
            cantidadTexto === "" ||
            !Number.isInteger(indice) ||
            indice < 0 ||
            indice >= productos.length ||
            !Number.isInteger(cantidad) ||
            cantidad <= 0) {

            mostrarMensaje("Seleccione un producto e ingrese una cantidad válida.", "red");
            return;
        }

        const producto = productos[indice];
        const productoEnCarrito = carrito.find(item => item.indice === indice);
        const cantidadEnCarrito = productoEnCarrito ? productoEnCarrito.cantidad : 0;

        if (cantidadEnCarrito + cantidad > producto.cantidad + cantidadEnCarrito) {
            mostrarMensaje("No hay suficiente inventario.", "red");
            return;
        }

        if (productoEnCarrito) {
            productoEnCarrito.cantidad += cantidad;
        } else {
            carrito.push({ indice, cantidad });
        }

        producto.cantidad -= cantidad;
        renderizarInventario();
        renderizarCarrito();

        elementos.cantidadPedido.value = "";
        elementos.productoPedido.value = "";

        mostrarMensaje("Producto agregado al carrito.", "green");
    }

    function renderizarCarrito() {
        elementos.carrito.replaceChildren();
        let total = 0;

        carrito.forEach((item) => {
            const producto = productos[item.indice];
            const subtotal = producto.precio * item.cantidad;
            total += subtotal;

            const fila = document.createElement("tr");
            fila.innerHTML = `
                <td>${producto.nombre}</td>
                <td>${item.cantidad}</td>
                <td>L. ${subtotal.toFixed(2)}</td>
                <td>
                    <button class="eliminar" data-indice="${item.indice}">
                        Eliminar
                    </button>
                </td>
            `;

            elementos.carrito.append(fila);
        });

        elementos.totalCarrito.textContent = "Total: L. " + total.toFixed(2);
    }

    function eliminarDelCarrito(indice) {
        const item = carrito.find(producto => producto.indice === indice);
        if (!item) return;

        productos[indice].cantidad += item.cantidad;
        carrito = carrito.filter(producto => producto.indice !== indice);
        renderizarInventario();
        renderizarCarrito();
        mostrarMensaje("Producto eliminado del carrito.", "green");
    }

    function cancelarCarrito() {
        if (carrito.length === 0) {
            mostrarMensaje("El carrito ya está vacío.", "red");
            return;
        }

        carrito.forEach(item => {
            productos[item.indice].cantidad += item.cantidad;
        });

        carrito = [];
        renderizarInventario();
        renderizarCarrito();
        mostrarMensaje("Pedido cancelado y carrito vaciado.", "red");
    }

    function confirmarPedido() {
        if (carrito.length === 0) {
            mostrarMensaje("El carrito está vacío.", "red");
            return;
        }

        const productosPedido = carrito.map(item => {
            const producto = productos[item.indice];
            return `${producto.nombre} (x${item.cantidad})`;
        }).join(", ");

        const total = carrito.reduce((sum, item) => {
            const producto = productos[item.indice];
            return sum + producto.precio * item.cantidad;
        }, 0);

        pedidosRealizados.push({
            productos: productosPedido,
            items: carrito.map(item => ({ ...item })),
            total,
            estado: "Pendiente"
        });

        carrito = [];
        renderizarCarrito();
        renderizarPedidosRealizados();
        mostrarMensaje("Pedido confirmado.", "green");
    }

    function cancelarPedidoConfirmado(indice) {
        const pedido = pedidosRealizados[indice];
        if (!pedido || pedido.estado === "Cancelado") return;

        pedido.items.forEach(item => {
            if (productos[item.indice]) {
                productos[item.indice].cantidad += item.cantidad;
            }
        });

        pedido.estado = "Cancelado";
        renderizarInventario();
        renderizarPedidosRealizados();
        mostrarMensaje("Pedido cancelado. El inventario fue restaurado.", "red");
    }

    function renderizarPedidosRealizados() {
        elementos.pedidos.replaceChildren();

        pedidosRealizados.forEach((pedido, index) => {
            const fila = document.createElement("tr");
            if (pedido.estado === "Cancelado") fila.classList.add("pedido-cancelado");

            fila.innerHTML = `
                <td>${index + 1}</td>
                <td>${pedido.productos}</td>
                <td>L. ${pedido.total.toFixed(2)}</td>
                <td>${pedido.estado}</td>
                <td>
                    ${pedido.estado === "Pendiente"
                        ? `<button class="cancelar-confirmado" data-indice="${index}">Cancelar pedido</button>`
                        : "—"}
                </td>
            `;

            elementos.pedidos.append(fila);
        });
    }

    function mostrarMensaje(texto, color) {
        elementos.mensaje.textContent = texto;
        elementos.mensaje.style.color = color;
    }

    elementos.registrarProducto.addEventListener("click", crearProducto);
    elementos.agregarCarrito.addEventListener("click", agregarAlCarrito);
    elementos.confirmarPedido.addEventListener("click", confirmarPedido);
    elementos.cancelarPedido.addEventListener("click", cancelarCarrito);

    elementos.carrito.addEventListener("click", (evento) => {
        if (evento.target.classList.contains("eliminar")) {
            eliminarDelCarrito(Number(evento.target.dataset.indice));
        }
    });

    elementos.pedidos.addEventListener("click", (evento) => {
        if (evento.target.classList.contains("cancelar-confirmado")) {
            cancelarPedidoConfirmado(Number(evento.target.dataset.indice));
        }
    });

    renderizarInventario();
</script>

</body>
</html>
